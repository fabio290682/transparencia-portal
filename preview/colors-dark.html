<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", sans-serif; background: #0a1f0e; padding: 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { border-radius: 10px; overflow: hidden; flex: 1; min-width: 80px; }
  .color-block { height: 64px; }
  .swatch-label { padding: 6px 8px; background: #0f2914; border: 1px solid #1f4a25; border-top: none; border-radius: 0 0 10px 10px; }
  .swatch-label .name { font-size: 10px; font-weight: 700; color: #e8f0ea; letter-spacing: 0.04em; }
  .swatch-label .hex { font-size: 10px; color: rgba(232,240,234,0.5); font-family: monospace; }
  .section-title { font-size: 10px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: #f5c800; margin-bottom: 8px; margin-top: 16px; }
  .section-title:first-child { margin-top: 0; }
</style>
</head>
<body>
  <div class="section-title">Dark Background Scale</div>
  <div class="row">
    <div class="swatch"><div class="color-block" style="background:#08180b"></div><div class="swatch-label"><div class="name">dark-900</div><div class="hex">#08180b</div></div></div>
    <div class="swatch"><div class="color-block" style="background:#0a1f0e"></div><div class="swatch-label"><div class="name">dark-bg</div><div class="hex">#0a1f0e</div></div></div>
    <div class="swatch"><div class="color-block" style="background:#0f2914"></div><div class="swatch-label"><div class="name">dark-panel</div><div class="hex">#0f2914</div></div></div>
    <div class="swatch"><div class="color-block" style="background:#13341a"></div><div class="swatch-label"><div class="name">dark-soft</div><div class="hex">#13341a</div></div></div>
    <div class="swatch"><div class="color-block" style="background:#1f4a25"></div><div class="swatch-label"><div class="name">line</div><div class="hex">#1f4a25</div></div></div>
  </div>
  <div class="section-title">Text on Dark</div>
  <div class="row">
    <div class="swatch"><div class="color-block" style="background:#e8f0ea"></div><div class="swatch-label"><div class="name">text-onDark</div><div class="hex">#e8f0ea</div></div></div>
    <div class="swatch"><div class="color-block" style="background:rgba(232,240,234,0.62)"></div><div class="swatch-label"><div class="name">text-muted</div><div class="hex">rgba .62</div></div></div>
    <div class="swatch"><div class="color-block" style="background:#f5c800"></div><div class="swatch-label"><div class="name">gold-accent</div><div class="hex">#f5c800</div></div></div>
  </div>
  <div class="section-title">Status</div>
  <div class="row">
    <div class="swatch"><div class="color-block" style="background:#4ade80"></div><div class="swatch-label"><div class="name">success</div><div class="hex">#4ade80</div></div></div>
    <div class="swatch"><div class="color-block" style="background:#fb923c"></div><div class="swatch-label"><div class="name">warn</div><div class="hex">#fb923c</div></div></div>
    <div class="swatch"><div class="color-block" style="background:#8a1f11"></div><div class="swatch-label"><div class="name">error</div><div class="hex">#8a1f11</div></div></div>
  </div>
</body>
</html>
